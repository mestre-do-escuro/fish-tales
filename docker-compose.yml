services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pescador:pescador@db:5432/pescador
      BETTER_AUTH_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
